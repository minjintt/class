<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>웹앱 프롬프트 만들기 · 바이브코딩 첫걸음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2A5A;
  --ink-soft:#4A557F;
  --ink-faint:#8A93B5;
  --paper:#FFFFFF;
  --grid-bg:#EEF2FB;
  --grid-line:#DCE3F4;
  --line:#C9D2EA;
  --accent:#3D4BD8;
  --accent-ink:#FFFFFF;
  --mark:#FFE45C;
  --mark-soft:#FFF4B0;
  --ok:#1E8A5E;
  --ok-soft:#E1F5EC;
  --warn:#C2410C;
  --warn-soft:#FFEDE3;
  --info-soft:#E6EAFF;
  --radius-s:8px;
  --radius-m:14px;
  --tap:52px;
  --font:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  font-family:var(--font);color:var(--ink);font-size:17px;line-height:1.6;
  word-break:keep-all;overflow-wrap:break-word;
  background-color:var(--grid-bg);
  background-image:
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:28px 28px;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 상단 진행 표시 */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(238,242,251,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
}
.topbar-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:15px;white-space:nowrap;background:none;border:0;padding:6px 0}
.progress{flex:1;display:flex;gap:4px}
.progress span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress span.done{background:var(--accent)}
.progress span.now{background:var(--mark);box-shadow:inset 0 0 0 2px var(--ink)}
.step-count{font-size:14px;color:var(--ink-soft);white-space:nowrap}

main{max-width:760px;margin:0 auto;padding:20px 16px 130px}

/* 시트(종이) */
.sheet{
  background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--radius-m);
  padding:26px 22px;box-shadow:5px 5px 0 var(--ink);
}
@media (min-width:640px){.sheet{padding:34px 36px}}
.step-tag{display:inline-block;font-size:14px;font-weight:600;color:var(--accent);margin-bottom:4px}
h1,h2,h3{line-height:1.3;margin:0}
h1{font-size:clamp(28px,6vw,40px);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(23px,4.6vw,28px);font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;font-weight:600}
.lead{color:var(--ink-soft);margin:8px 0 0}
.q{margin-top:30px;scroll-margin-top:90px}
.q:first-of-type{margin-top:24px}
.q > h3{margin-bottom:4px}
.q .hint{font-size:15px;color:var(--ink-soft);margin:0 0 12px}
.q.missing > h3::after{content:"  ← 답해 주세요";color:var(--warn);font-size:15px;font-weight:600}

/* 선택 버튼 */
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.choices.wide{grid-template-columns:1fr}
.choices.two{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.choice{
  min-height:var(--tap);text-align:left;
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-s);
  padding:12px 14px;font-size:16px;line-height:1.4;
  display:flex;align-items:center;gap:10px;
  transition:border-color .12s,background .12s;
}
.choice:hover{border-color:var(--ink-soft)}
.choice[aria-pressed="true"]{
  border-color:var(--ink);
  background:linear-gradient(transparent 8%,var(--mark) 8%,var(--mark) 92%,transparent 92%);
  font-weight:600;
}
.choice .emo{font-size:22px;line-height:1}
.choice small{display:block;font-weight:400;color:var(--ink-soft);font-size:14px;margin-top:2px}
.choice .tick{margin-left:auto;font-weight:700;opacity:0}
.choice[aria-pressed="true"] .tick{opacity:1}

/* 유형 카드 */
.types{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.types{grid-template-columns:repeat(3,minmax(0,1fr))}}
.types .choice{flex-direction:column;align-items:flex-start;padding:14px 16px}
.types .choice .emo{font-size:28px}
.types .choice{gap:6px}

/* 입력 */
.field{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-s);background:#fff;padding:12px 14px;font-size:17px;min-height:var(--tap)}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--info-soft)}
textarea.field{min-height:96px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px dashed var(--ink-faint);background:transparent;border-radius:999px;padding:8px 14px;font-size:15px;min-height:42px}
.chip:hover{border-style:solid;border-color:var(--ink-soft)}
.counter{font-size:13px;color:var(--ink-faint);text-align:right;margin-top:4px}

/* 사용 순서 */
.flow{list-style:none;margin:0;padding:0;counter-reset:f}
.flow li{display:flex;gap:8px;align-items:center;margin-bottom:10px;counter-increment:f}
.flow li::before{content:counter(f);flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.flow .field{flex:1;min-width:0}
.icon-btn{flex:none;width:44px;height:44px;border:1.5px solid var(--line);background:#fff;border-radius:var(--radius-s);font-size:17px;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--ink-soft)}
.icon-btn:disabled{opacity:.35;cursor:default}
.flow-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

.btn{min-height:var(--tap);border-radius:var(--radius-s);padding:10px 20px;font-weight:600;font-size:16px;border:1.5px solid var(--ink);background:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--line)}
.btn.small{min-height:44px;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}

/* 안내 상자 */
.note{border-radius:var(--radius-s);padding:14px 16px;font-size:15px;margin-top:14px;border:1.5px solid}
.note.info{background:var(--info-soft);border-color:#B9C2F5}
.note.warn{background:var(--warn-soft);border-color:#F5B796}
.note.ok{background:var(--ok-soft);border-color:#9ED8BD}
.note strong{display:block;margin-bottom:2px}
.gate{margin-top:18px;border:2px solid var(--warn);border-radius:var(--radius-m);padding:18px;background:#FFFBF8}
.gate h3{color:var(--warn)}

/* 만약에 카드 */
.whatif{border:1.5px solid var(--line);border-radius:var(--radius-m);padding:18px;margin-top:14px;background:#fff}
.whatif.answered{border-color:var(--ink)}
.whatif h3{font-size:17px;margin-bottom:4px}
.whatif .why{font-size:14px;color:var(--ink-soft);margin:0 0 12px}

/* 우선순위 */
.feat{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.feat:last-child{border-bottom:0}
.feat-name{flex:1 1 180px;font-weight:500}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:var(--radius-s);overflow:hidden;flex:none}
.seg button{border:0;background:#fff;min-height:44px;padding:6px 12px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--mark);font-weight:700}
.seg button[data-level="must"][aria-pressed="true"]{background:var(--ink);color:#fff}
.del-feat{border:0;background:none;color:var(--ink-faint);font-size:14px;min-height:44px;padding:0 6px}
.add-row{display:flex;gap:8px;margin-top:14px}
.add-row .field{flex:1;min-width:0}
.must-count{font-size:15px;margin-top:10px;color:var(--ink-soft)}

/* 확인 */
.summary p{margin:0 0 10px}
.summary .edit{font-size:14px;border:0;background:none;color:var(--accent);text-decoration:underline;padding:0 0 0 6px;min-height:auto}
.conflict{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.conflict .btn{flex:none}

/* 결과 */
.result-tabs{display:flex;gap:6px;margin:22px 0 0;flex-wrap:wrap}
.result-tabs button{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:8px 16px;min-height:44px;font-weight:600;font-size:15px}
.result-tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.prompt-paper{
  margin-top:16px;border:1.5px solid var(--ink);border-radius:var(--radius-s);
  background:#fff;max-height:62vh;overflow:auto;
}
.prompt-paper pre{margin:0;padding:18px;white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:15px;line-height:1.65}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.toggle{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px;border:1.5px solid var(--line);border-radius:var(--radius-s);background:#fff;cursor:pointer}
.toggle input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--accent)}
.toggle span{font-size:15px}
.guide ol{padding-left:22px;margin:10px 0}
.guide li{margin-bottom:10px}
.guide code{background:var(--mark-soft);padding:1px 6px;border-radius:4px;font-family:var(--font);font-weight:600}
.helper{border:1.5px solid var(--line);border-radius:var(--radius-s);padding:14px;margin-top:12px;background:#fff}
.helper p{margin:0 0 10px;font-size:15px;white-space:pre-wrap}
.helper h3{font-size:16px;margin-bottom:6px}

/* 시작 화면 */
.hero h1{margin-top:6px}
.hero .big{font-size:clamp(17px,3.6vw,19px);color:var(--ink-soft);margin:14px 0 0}
.how{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:12px}
.how li{display:flex;gap:12px;align-items:flex-start}
.how b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--mark);border:1.5px solid var(--ink);display:grid;place-items:center;font-size:14px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.foot{font-size:14px;color:var(--ink-faint);margin-top:22px}

/* 하단 이동 */
.navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.96);border-top:1.5px solid var(--ink);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
}
.navbar-inner{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.navbar .msg{flex:1;font-size:14px;color:var(--warn);font-weight:600;line-height:1.35}
.navbar .btn{min-width:96px}

.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <div class="topbar-inner">
    <button class="brand" type="button" data-action="home" aria-label="처음 화면으로">📝 프롬프트 만들기</button>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <span class="step-count" id="stepCount"></span>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<nav class="navbar" id="navbar" hidden>
  <div class="navbar-inner">
    <button class="btn ghost" type="button" data-action="prev">이전</button>
    <div class="msg" id="navMsg" role="status"></div>
    <button class="btn primary" type="button" data-action="next" id="nextBtn">다음</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

  var TYPES = {

    out.push('설명할 때는 개발 용어 대신 쉬운 말을 써 주시고, 꼭 필요한 용어는 뜻을 짧게 덧붙여 주세요.');

    var sections = [];
    var app = [];
    app.push('- 앱 종류: ' + T.label);
    var nm = String(s.appName || '').trim();
    if (nm) app.push('- 앱 이름: ' + nm);
    app.push('- 제가 직접 쓴 설명:');
    String(s.desc || '').trim().split(/\n+/).forEach(function (line) { if (line.trim()) app.push('  > ' + line.trim()); });
    sections.push(['만들고 싶은 앱', app, true]);

    sections.push(['사용하는 사람과 환경', envLines(s)]);

    var flow = cleanFlow(s);
    if (flow.length) {
      var fl = flow.map(function (t, i) { return (i + 1) + '. ' + t; });
      fl.push('');
      fl.push('위 순서(제가 직접 쓴 내용)대로 화면이 자연스럽게 이어지게 만들어 주세요. 순서가 어색하거나 빠진 화면이 있으면 보완하고, 무엇을 보완했는지 알려 주세요.');
      sections.push(['사용 순서', fl, true]);
    }

    var must = featuresBy(s, 'must'), nice = featuresBy(s, 'nice'), later = featuresBy(s, 'later');
    if (must.length) sections.push(['이번에 꼭 만들 기능', must]);
    if (nice.length) {
      var nl = nice.slice();
      nl.push('→ 위 기능은 꼭 만들 기능이 안정적으로 작동하는 범위에서만 넣어 주세요. 너무 복잡해지면 빼고, 뺐다고 알려 주세요.');
      sections.push(['여유가 있으면 넣을 기능', nl]);
    }
    if (later.length) {
      var ll = later.slice();
      ll.push('→ 위 기능은 이번에는 만들지 말아 주세요. 나중에 추가하기 쉬운 구조로만 만들어 주세요.');
      sections.push(['이번에는 만들지 않을 기능 (나중에 추가 예정)', ll]);
    }
    sections.push(['데이터 저장과 개인 정보', storageLines(s)]);
    sections.push(['디자인', designLines(s)]);
    sections.push(['이런 상황도 처리해 주세요', handleLines(s)]);
    sections.push(['기술 조건', techLines(s)]);
    sections.push(['완료 조건 (아래 행동이 모두 성공해야 완성입니다)', doneLines(s).map(function (t) { return '[ ] ' + t; }), true]);
    sections.push(['답변 방식', answerLines(s)]);

    var n = 0;
    sections.forEach(function (sec) {
      var lines = sec[1].filter(function (x) { return x !== undefined && x !== null; });
      if (!lines.length) return;
      n++;
      out.push('');
      out.push('## ' + n + '. ' + sec[0]);
      lines.forEach(function (l) {
        if (l === '') { out.push(''); return; }
        if (sec[2] || /^(- |→ |\[ \] |\d+\. |  > )/.test(l)) out.push(l);
        else out.push('- ' + l);
      });
    });
    return out.join('\n');
  }

  /* ---------- 충돌·빠진 것 점검 ---------- */
  function getIssues(s) {
    var I = [];
    function add(level, msg, step) { I.push({ level: level, msg: msg, step: step }); }
    if (!String(s.desc || '').trim()) add('block', '만들고 싶은 앱 설명이 비어 있어요.', 1);
    if (!s.type) add('block', '앱 종류를 골라 주세요.', 1);
    if (!s.users || !s.age || !(s.devices || []).length || !s.internet) add('block', '사용하는 사람과 기기에 대한 답이 빠져 있어요.', 2);
    if (cleanFlow(s).length < 2) add('block', '사용 순서를 2단계 이상 적어 주세요.', 3);
    if (!s.memory || !s.crossDevice || !s.seeOthers || !(s.privacy || []).length) add('block', '기억과 공유 질문에 답이 빠져 있어요.', 4);
    if (needShare(s) && !s.gate) add('block', '공유 방법을 골라 주세요. 파일 하나짜리 웹앱은 혼자서는 다른 기기와 데이터를 나눌 수 없어요.', 4);
    if (!s.mood || !s.sound || !s.images) add('block', '분위기 질문에 답이 빠져 있어요.', 5);
    var mustN = featuresBy(s, 'must').length;
    if (mustN === 0) add('block', '"꼭 필요" 기능이 하나도 없어요. 최소 1개는 골라 주세요.', 7);

    if (s.type === 'record' && s.memory === 'no' && !needShare(s)) add('warn', '기록 도구인데 "닫으면 기록이 남지 않아도 된다"고 답하셨어요. 이렇게 하면 앱을 닫는 순간 기록이 모두 사라져요. 의도한 것이 맞는지 확인해 주세요.', 4);
    if (s.gate === 'server') add('warn', '인터넷 서버(Firebase)를 쓰면 Firebase 가입과 설정을 직접 해야 해서 처음 만드는 분에게는 꽤 어려워요. 처음에는 한 기기용으로 만들고, 잘 작동하면 공유를 추가하는 방법도 있어요.', 4);
    if (s.gate === 'server' && s.internet === 'maybe') add('warn', 'Firebase는 인터넷이 있어야 작동해요. 인터넷이 끊길 수 있는 곳이라면 그때는 공유가 멈춰요.', 4);
    if (s.gate === 'server' && s.users === 'anyone') add('warn', '누구나 쓰는 앱에 공유 서버를 붙이면 장난 입력이나 데이터 삭제 위험이 커져요. 보안 규칙 설정이 꼭 필요해요.', 4);
    if (has(s.privacy, 'contact') && isChild(s)) add('warn', '학생 연락처·주소는 꼭 필요한 경우가 아니라면 받지 않는 것이 안전해요.', 4);
    if (has(s.privacy, 'photo') && s.gate === 'server') add('info', '사진(특히 학생 얼굴)을 인터넷 서버에 올리는 것은 신중해야 해요. 요청서에는 사진은 기기 안에서만 다루도록 적어 둘게요.', 4);
    if (has(s.privacy, 'name') && s.gate === 'server' && isChild(s)) add('info', '학생 이름이 서버에 저장돼요. 실명 대신 별명·번호를 쓰도록 권하는 문구를 요청서에 넣을게요.', 4);
    if ((s.crossDevice === 'unknown' || s.seeOthers === 'unknown') && !needShare(s)) add('info', '공유 여부를 정하지 않으셨어요. 우선 한 기기용으로 만들고, 나중에 공유를 추가하기 쉬운 구조로 요청할게요.', 4);
    if (s.images === 'yes') add('info', 'GitHub Pages에 올릴 때 index.html과 함께 이미지 파일도 같은 곳에 올려야 해요.', 5);
    if (mustN > 6) add('warn', '"꼭 필요" 기능이 ' + mustN + '개예요. 한 번에 많이 요청하면 AI가 실수할 가능성이 커져요. 5~6개 이하로 줄이고 나머지는 "나중에"로 옮기는 것을 권해요.', 7);
    if (s.type === 'quiz' && s.cards) {
      var rv = s.cards.q_reveal, bk = s.cards.q_back;
      var revealNow = rv !== 1;      // 답하지 않으면 기본값은 "바로 알려주기"
      var canBack = bk === 0;         // 직접 "바꿀 수 있게"를 고른 경우만
      if (revealNow && canBack) add('warn', '정답을 바로 알려주면서 이전 문제로 돌아가 답을 바꿀 수 있으면, 정답을 확인한 뒤 고칠 수 있어요. 둘 중 하나를 바꾸는 것을 권해요.', 6);
      if (s.cards.q_editor === 1 && s.memory === 'no') add('info', '앱 화면에서 문제를 고치려면 고친 문제는 저장되어야 해요. 그 부분은 저장되도록 요청서에 적을게요.', 6);
    }
    if ((s.type === 'game') && featLevel(s, 'g_timer') === 'must' && s.age === 'e12') add('info', '1~2학년에게 제한 시간은 부담이 될 수 있어요. 시간 없이 하는 연습 모드도 생각해 보세요.', 7);
    if (s.type === 'photo' && featOn(s, 'p_camera') && (s.devices || []).length === 1 && has(s.devices, 'pc')) add('info', '컴퓨터에는 카메라가 없을 수도 있어요. 앨범(파일)에서 불러오기도 꼭 필요해요.', 7);
    if (s.cards && s.cards.c_refresh === 0 && s.memory === 'no') add('info', '"하던 곳부터 이어서"를 고르셨으니, 기록은 남기지 않더라도 진행 중인 내용은 잠시 저장되도록 요청서에 적을게요.', 6);
    return I;
  }

  /* ---------- 확인 화면 요약 ---------- */
  function summary(s) {
    var T = TYPES[s.type];
    var rows = [];
    rows.push([1, (T ? T.emo + ' ' + T.label : '종류 미선택') + ' — "' + trimText(String(s.desc || '').trim() || '(설명 없음)', 80) + '"']);
    var who = (labelOf('age', s.age) || '?') + ' / ' + (labelOf('users', s.users) || '?');
    var dev = (s.devices || []).map(function (k) { return labelOf('devices', k); }).join(', ') || '?';
    rows.push([2, who + ' — ' + dev + '에서 사용해요.']);
    var flow = cleanFlow(s);
    rows.push([3, flow.length + '단계 — ' + flow.map(function (t) { return trimText(t, 18); }).join(' → ')]);
    var st;
    if (needShare(s)) {
      st = s.gate === 'local' ? '공유는 나중에 하고, 우선 이 기기 안에만 저장해요.'
        : s.gate === 'file' ? '이 기기에 저장하고, 다른 기기로는 파일을 주고받아 옮겨요.'
        : s.gate === 'server' ? '인터넷 서버(Firebase)로 여러 기기·사람이 함께 써요. 만들기 난이도가 올라가요.'
        : '공유 방법을 아직 고르지 않았어요.';
    } else if (s.memory === 'no') st = '기록은 남기지 않아요. 닫으면 처음부터 시작해요.';
    else st = '닫았다 열어도 기록이 남아요. (이 기기 안에만)';
    rows.push([4, st]);
    var d = [labelOf('mood', s.mood) ? labelOf('mood', s.mood) + ' 느낌' : '', s.sound === 'yes' ? '효과음 있음' : s.sound === 'no' ? '소리 없음' : '소리는 켜고 끌 수 있게'];
    rows.push([5, d.filter(Boolean).join(', ')]);
    var vc = visibleCards(s), answered = vc.filter(function (c) { return s.cards && typeof s.cards[c.id] === 'number'; }).length;
    rows.push([6, '놓치기 쉬운 상황 ' + vc.length + '가지 중 ' + answered + '가지에 답했어요.' + (answered < vc.length ? ' 나머지는 안전한 기본값으로 처리해요.' : '')]);
    rows.push([7, '꼭 필요 ' + featuresBy(s, 'must').length + '개 · 여유 있으면 ' + featuresBy(s, 'nice').length + '개 · 나중에 ' + featuresBy(s, 'later').length + '개']);
    return rows;
  }

  function defaultFeatures(type) {
    var T = TYPES[type];
    if (!T) return [];
    return T.features.map(function (f) { return { id: f[0], label: f[1], level: f[2], custom: false }; });
  }

  function newState() {
    return {
      v: 1, step: 0, lastStep: 1,
      appName: '', desc: '', type: null,
      users: null, age: null, devices: [], internet: null,
      flow: [], flowTouched: false,
      memory: null, crossDevice: null, seeOthers: null, privacy: [], gate: null,
      mood: null, moodCustom: '', color: 'auto', sound: null, images: null,
      cards: {},
      features: [], featuresTouched: false,
      askFirst: true
    };
  }

  return {
    OPT: OPT, TYPES: TYPES, TYPE_ORDER: TYPE_ORDER, CARDS: CARDS,
    visibleCards: visibleCards, buildPrompt: buildPrompt, getIssues: getIssues,
    summary: summary, defaultFeatures: defaultFeatures, newState: newState,
    needShare: needShare, cleanFlow: cleanFlow, featuresBy: featuresBy, has: has,
    envLines: envLines, storageLines: storageLines, designLines: designLines, isChild: isChild
  };
})();
if (typeof module !== 'undefined') module.exports = PG;

<script>
/* =========================================================
   2) 화면 그리기와 버튼 동작
   ========================================================= */
(function () {
  'use strict';
  var STORE_KEY = 'vibe-prompt-maker:v1';   // 이 앱 전용 저장 이름
  var LAST_Q = 7;                            // 질문 단계 수 (1~7)
  var CONFIRM = 8, RESULT = 9;
  var STEP_NAMES = ['', '무엇을 만들까요', '누가, 어디서 쓰나요', '사용 순서', '기억과 공유', '분위기', '만약에 점검', '기능 우선순위', '내용 확인'];

  var app = document.getElementById('app');
  var navbar = document.getElementById('navbar');
  var topbar = document.getElementById('topbar');
  var navMsg = document.getElementById('navMsg');
  var nextBtn = document.getElementById('nextBtn');

  var S = load();
  var hadSaved = hasProgress(S);
  var resultTab = 'prompt';
  var focusKey = null;
  var saveTimer = null;

  /* ---------- 저장 ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return PG.newState();
      var data = JSON.parse(raw);
      if (!data || data.v !== 1) return PG.newState();
      var base = PG.newState();
      Object.keys(base).forEach(function (k) { if (data[k] !== undefined) base[k] = data[k]; });
      if (!Array.isArray(base.devices)) base.devices = [];
      if (!Array.isArray(base.privacy)) base.privacy = [];
      if (!Array.isArray(base.flow)) base.flow = [];
      if (!Array.isArray(base.features)) base.features = [];
      if (!base.cards || typeof base.cards !== 'object') base.cards = {};
      if (typeof base.step !== 'number' || base.step < 0 || base.step > RESULT) base.step = 0;
      return base;
    } catch (e) { return PG.newState(); }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* 저장 못 해도 계속 사용 가능 */ }
  }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }
  function hasProgress(s) { return !!(s.type || String(s.desc || '').trim() || s.step > 0); }

  /* ---------- 도우미 ---------- */
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }
  function choice(q, o, pressed, multi) {
    return '<button type="button" class="choice" data-action="' + (multi ? 'toggle' : 'pick') + '" data-q="' + q + '" data-v="' + o[0] + '" aria-pressed="' + (pressed ? 'true' : 'false') + '">' +
      '<span class="emo" aria-hidden="true">' + o[1] + '</span><span>' + esc(o[2]) + (o[3] ? '<small>' + esc(o[3]) + '</small>' : '') + '</span>' +
      '<span class="tick" aria-hidden="true">✓</span></button>';
  }
  function qBlock(id, title, hint, inner) {
    return '<section class="q" id="q-' + id + '"><h3>' + esc(title) + '</h3>' + (hint ? '<p class="hint">' + esc(hint) + '</p>' : '') + inner + '</section>';
  }
  function choiceGroup(q, opts, value, cls, multi) {
    return '<div class="choices ' + (cls || '') + '" role="group">' + opts.map(function (o) {
      var on = multi ? PG.has(value, o[0]) : value === o[0];
      return choice(q, o, on, multi);
    }).join('') + '</div>';
  }
  function preview(lines, title) {
    if (!lines.length) return '';

      lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul></details>';
  }
  function note(kind, title, body) {
    return '<div class="note ' + kind + '">' + (title ? '<strong>' + esc(title) + '</strong>' : '') + esc(body) + '</div>';
  }

  /* ---------- 단계별 화면 ---------- */
  function vStart() {
    var resume = hadSaved && hasProgress(S);
    return '<div class="sheet hero">' +
      '<span class="step-tag">바이브코딩 첫걸음</span>' +
      '<h1>AI에게 웹앱을 부탁하는 요청서 만들기</h1>' +
      '<p class="big">개발 용어는 몰라도 괜찮아요. 쓰는 장면을 떠올리며 질문에 답하면, ChatGPT·Claude·Gemini에 그대로 붙여넣을 요청서가 만들어져요.</p>' +
      '<ol class="how">' +
      '<li><b>1</b><span>만들고 싶은 앱과 쓰는 사람을 골라요.</span></li>' +
      '<li><b>2</b><span>만들고 나서야 알게 되는 상황을 미리 점검해요.</span></li>' +
      '<li><b>3</b><span>완성된 요청서를 복사해서 AI에게 보내요.</span></li>' +
      '</ol>' +
      '<div class="hero-actions">' +
      (resume
        ? '<button class="btn primary" type="button" data-action="resume">이어서 하기</button><button class="btn" type="button" data-action="restart">새로 시작하기</button>'
        : '<button class="btn primary" type="button" data-action="start">시작하기</button>') +
      '</div>' +
      '<p class="foot">7단계, 10분 정도 걸려요. 답변은 이 브라우저에만 저장되고 다른 곳으로 보내지지 않아요.</p>' +
      '</div>';
  }

  function vStep1() {
    var T = PG.TYPES;
    var types = '<div class="types" role="group">' + PG.TYPE_ORDER.map(function (k) {
      return '<button type="button" class="choice" data-action="type" data-v="' + k + '" aria-pressed="' + (S.type === k) + '">' +
        '<span class="emo" aria-hidden="true">' + T[k].emo + '</span><span>' + esc(T[k].label) + '<small>' + esc(T[k].short) + '</small></span></button>';
    }).join('') + '</div>';
    var ex = S.type ? T[S.type].examples : ['구구단을 빨리 맞히는 게임', '랜덤 발표자 뽑기', '독서 기록장'];
    var chips = '<div class="chips">' + ex.map(function (e) {
      return '<button type="button" class="chip" data-action="example" data-text="' + esc(e) + '">' + esc(e) + '</button>';
    }).join('') + '</div>';
    return head(1, '어떤 웹앱을 만들고 싶으세요?', '정확하지 않아도 괜찮아요. 나중에 언제든 고칠 수 있어요.') +
      qBlock('type', '어떤 종류에 가장 가까운가요?', '', types) +
      qBlock('desc', '한두 줄로 설명해 주세요', '누가, 무엇을 하는 앱인지 적으면 충분해요. 예시를 눌러도 돼요.',

        '</div>';
    } else {
      body = note('ok', '가장 중요한 습관', '고쳐 달라고 할 때는 항상 가장 최근 index.html 코드 전체를 함께 붙여넣으세요. 그래야 AI가 예전 코드로 되돌리거나 멀쩡한 기능을 지우지 않아요.') +
        HELPERS.map(function (h, i) {
          return '<div class="helper"><h3>' + esc(h[0]) + '</h3><p>' + esc(h[1]) + '</p><button type="button" class="btn small" data-action="copy-helper" data-i="' + i + '">이 질문 복사하기</button></div>';
        }).join('') +
        note('info', '', '[ ] 안의 내용은 내 상황에 맞게 바꿔서 보내세요. 대화가 너무 길어져 AI가 헷갈려 하면, 새 대화를 열고 요청서와 최신 코드를 함께 붙여넣는 것이 좋아요.');
    }
    return '<div class="sheet"><span class="step-tag">완성</span><h2>요청서가 완성됐어요</h2>' +
      '<p class="lead">복사해서 AI에게 보내면 돼요. 답을 바꾸고 싶으면 "내용 고치기"를 누르세요.</p>' +
      '<div class="result-tabs" role="tablist">' + tabs.map(function (t) {
        return '<button type="button" role="tab" data-action="tab" data-tab="' + t[0] + '" aria-selected="' + (resultTab === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div>' + body +
      '<div class="result-actions" style="margin-top:26px;border-top:1px dashed var(--line);padding-top:18px"><button type="button" class="btn ghost" data-action="restart">처음부터 새로 만들기</button></div>' +
      '</div>';
  }

  function head(n, title, lead) {
    return '<div class="sheet"><span class="step-tag">' + n + '단계 · ' + esc(STEP_NAMES[n]) + '</span><h2>' + esc(title) + '</h2>' + (lead ? '<p class="lead">' + esc(lead) + '</p>' : '');
  }
  function endSheet() { return '</div>'; }

  /* ---------- 단계별 빠진 답 ---------- */
  function missing(step) {
    var m = [];
    if (step === 1) { if (!S.type) m.push('type'); if (String(S.desc || '').trim().length < 2) m.push('desc'); }
    if (step === 2) { if (!S.users) m.push('users'); if (!S.age) m.push('age'); if (!S.devices.length) m.push('devices'); if (!S.internet) m.push('internet'); }
    if (step === 3) { if (PG.cleanFlow(S).length < 2) m.push('flow'); }
    if (step === 4) {
      if (!S.memory) m.push('memory'); if (!S.crossDevice) m.push('crossDevice'); if (!S.seeOthers) m.push('seeOthers');
      if (PG.needShare(S) && !S.gate) m.push('gate');
      if (!S.privacy.length) m.push('privacy');
    }
    if (step === 5) { if (!S.mood) m.push('mood'); if (!S.sound) m.push('sound'); if (!S.images) m.push('images'); }
    if (step === 7) { if (!PG.featuresBy(S, 'must').length) m.push('features'); }
    return m;
  }
  var MISSING_MSG = { 3: '사용 순서를 2단계 이상 적어 주세요.', 7: '"꼭 필요" 기능을 최소 1개 골라 주세요.' };

  /* ---------- 그리기 ---------- */
  function render(opts) {
    opts = opts || {};
    var st = S.step;
    var views = [vStart, vStep1, vStep2, vStep3, vStep4, vStep5, vStep6, vStep7, vConfirm, vResult];
    app.innerHTML = views[st]();
    topbar.hidden = st === 0;
    navbar.hidden = st === 0;
    navMsg.textContent = '';
    if (st > 0) {
      var prog = '';
      for (var i = 1; i <= CONFIRM; i++) prog += '<span class="' + (i < st || st === RESULT ? 'done' : i === st ? 'now' : '') + '"></span>';
      document.getElementById('progress').innerHTML = prog;
      document.getElementById('stepCount').textContent = st === RESULT ? '완성' : st + ' / ' + CONFIRM;
      nextBtn.hidden = st === RESULT;
      nextBtn.textContent = st === CONFIRM ? '요청서 만들기' : '다음';
      document.querySelector('[data-action="prev"]').textContent = st === RESULT ? '내용 고치기' : '이전';
      if (st === CONFIRM) {
        var blocks = PG.getIssues(S).filter(function (x) { return x.level === 'block'; });
        nextBtn.disabled = blocks.length > 0;
        if (blocks.length) navMsg.textContent = '"꼭 고쳐야 해요"를 먼저 해결해 주세요.';
      } else nextBtn.disabled = false;
    }
    if (opts.top) window.scrollTo(0, 0);
    if (focusKey) {
      var el = document.querySelector(focusKey);
      if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
      focusKey = null;
    }
  }

  function go(step) {
    S.step = Math.max(0, Math.min(RESULT, step));
    if (S.step >= 1) S.lastStep = S.step;
    save();
    render({ top: true });
  }

  function markMissing(list) {
    list.forEach(function (id) { var el = document.getElementById('q-' + id); if (el) el.classList.add('missing'); });
    var first = document.getElementById('q-' + list[0]);
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
    navMsg.textContent = MISSING_MSG[S.step] || '빠진 답이 있어요. 표시된 질문에 답해 주세요.';
  }

  /* ---------- 상태 바꾸기 ---------- */
  function setType(v) {
    S.type = v;
    if (!S.flowTouched || !PG.cleanFlow(S).length) { S.flow = PG.TYPES[v].flow.slice(); S.flowTouched = false; }
    if (!S.featuresTouched || !S.features.length) { S.features = PG.defaultFeatures(v); S.featuresTouched = false; }
  }

  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? done : '복사가 안 됐어요. 글자를 길게 눌러 직접 복사해 주세요.');
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast(done); }, fallback);
    } else fallback();
  }

  /* ---------- 클릭 처리 ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    var a = b.getAttribute('data-action');
    var d = b.dataset;

    switch (a) {
      case 'start': hadSaved = false; go(1); return;
      case 'resume': go(S.lastStep || 1); return;
      case 'restart':
        if (hasProgress(S) && !window.confirm('지금까지의 답변이 지워지고 처음부터 시작해요. 괜찮을까요?')) return;
        S = PG.newState(); hadSaved = false; resultTab = 'prompt'; go(1); return;
      case 'home': hadSaved = hasProgress(S); go(0); return;
      case 'prev': go(S.step - 1); return;
      case 'next':
        if (S.step >= 1 && S.step <= LAST_Q) {
          var m = missing(S.step);
          if (m.length) { markMissing(m); return; }
        }
        if (S.step === CONFIRM) resultTab = 'prompt';
        go(S.step + 1); return;
      case 'goto': go(parseInt(d.step, 10)); return;

      case 'type': setType(d.v); focusKey = '[data-action="type"][data-v="' + d.v + '"]'; break;
      case 'example':
        S.desc = d.text;
        var ta = document.getElementById('descInput');
        if (ta) { ta.value = S.desc; document.getElementById('descCount').textContent = S.desc.length; }
        save(); return;

      case 'pick':
        S[d.q] = d.v;
        if ((d.q === 'crossDevice' || d.q === 'seeOthers') && !PG.needShare(S)) S.gate = null;
        focusKey = '[data-action="pick"][data-q="' + d.q + '"][data-v="' + d.v + '"]';
        break;
      case 'toggle':
        var arr = S[d.q].slice();
        var idx = arr.indexOf(d.v);
        if (idx >= 0) arr.splice(idx, 1);
        else {
          if (d.q === 'privacy') arr = d.v === 'none' ? [] : arr.filter(function (x) { return x !== 'none'; });
          arr.push(d.v);
        }
        S[d.q] = arr;
        focusKey = '[data-action="toggle"][data-q="' + d.q + '"][data-v="' + d.v + '"]';
        break;

      case 'flow-add': S.flow.push(''); S.flowTouched = true; save(); render();
        var ins = app.querySelectorAll('[data-flow-i]'); if (ins.length) ins[ins.length - 1].focus(); return;
      case 'flow-del': S.flow.splice(+d.i, 1); S.flowTouched = true; break;
      case 'flow-up': var i = +d.i; if (i > 0) { var t = S.flow[i]; S.flow[i] = S.flow[i - 1]; S.flow[i - 1] = t; } S.flowTouched = true; break;
      case 'flow-down': var j = +d.i; if (j < S.flow.length - 1) { var u = S.flow[j]; S.flow[j] = S.flow[j + 1]; S.flow[j + 1] = u; } S.flowTouched = true; break;
      case 'flow-reset': if (S.type) { S.flow = PG.TYPES[S.type].flow.slice(); S.flowTouched = false; } break;

      case 'card': S.cards[d.id] = +d.i; focusKey = '[data-action="card"][data-id="' + d.id + '"][data-i="' + d.i + '"]'; break;

      case 'feat-level': S.features[+d.i].level = d.level; S.featuresTouched = true;
        focusKey = '[data-action="feat-level"][data-i="' + d.i + '"][data-level="' + d.level + '"]'; break;
      case 'feat-del': S.features.splice(+d.i, 1); S.featuresTouched = true; break;
      case 'feat-add': addFeature(); return;
      case 'feat-reset': if (S.type) { S.features = PG.defaultFeatures(S.type); S.featuresTouched = false; } break;

      case 'tab': resultTab = d.tab; render(); return;
      case 'copy': copyText(PG.buildPrompt(S), '요청서를 복사했어요. AI 대화창에 붙여넣으세요.'); return;
      case 'copy-helper': copyText(HELPERS[+d.i][1], '질문을 복사했어요.'); return;
      case 'download':
        try {
          var blob = new Blob([PG.buildPrompt(S)], { type: 'text/plain;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          var nm = String(S.appName || '').trim().replace(/[\\/:*?"<>|]/g, '') || '웹앱';
          link.href = url; link.download = nm + '-요청서.txt';
          document.body.appendChild(link); link.click(); document.body.removeChild(link);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          toast('텍스트 파일로 저장했어요.');
        } catch (err) { toast('저장이 안 됐어요. "요청서 복사하기"를 이용해 주세요.'); }
        return;
      default: return;
    }
    save();
    render();
  });

  function addFeature() {
    var inp = document.getElementById('featInput');
    var v = inp ? inp.value.trim() : '';
    if (!v) { toast('추가할 기능을 먼저 적어 주세요.'); if (inp) inp.focus(); return; }
    var dup = S.features.some(function (f) { return f.label.trim() === v; });
    if (dup) { toast('이미 있는 기능이에요.'); return; }
    S.features.push({ id: 'u' + Date.now(), label: v, level: 'must', custom: true });
    S.featuresTouched = true;
    save(); render();
    var again = document.getElementById('featInput'); if (again) again.focus();
    toast('"' + v + '"을(를) 꼭 필요한 기능으로 추가했어요.');
  }

  /* ---------- 글자 입력 ---------- */
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.bind) {
      S[t.dataset.bind] = t.value;
      if (t.dataset.bind === 'desc') {
        var c = document.getElementById('descCount'); if (c) c.textContent = t.value.length;
        var q = document.getElementById('q-desc'); if (q && t.value.trim()) q.classList.remove('missing');
      }
      saveSoon();
    } else if (t.dataset.flowI !== undefined) {
      S.flow[+t.dataset.flowI] = t.value; S.flowTouched = true;
      saveSoon();
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'askFirst') {
      S.askFirst = e.target.checked; save();
      var pre = document.getElementById('promptText'); if (pre) pre.textContent = PG.buildPrompt(S);
      toast(S.askFirst ? '먼저 질문하기를 켰어요.' : '먼저 질문하기를 껐어요.');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'featInput' && !e.isComposing) { e.preventDefault(); addFeature(); }
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.flowI !== undefined && !e.isComposing) {
      e.preventDefault();
      if (S.flow.length < 8) { S.flow.splice(+e.target.dataset.flowI + 1, 0, ''); S.flowTouched = true; save(); render();
        var nx = app.querySelector('[data-flow-i="' + (+e.target.dataset.flowI + 1) + '"]'); if (nx) nx.focus(); }
    }
  });
  window.addEventListener('beforeunload', save);

  // 앱을 열면 항상 시작 화면부터. 저장된 답이 있으면 "이어서 하기"로 마지막 단계에 돌아가요.
  S.step = 0;
  render();
})();
</script>
</body>
</html>
